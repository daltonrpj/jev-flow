<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">JEV Flow architecture</title><desc id="desc">Input state passes to a typed question, schema validation, code owned policy, and an explicit result and evidence log.</desc>
