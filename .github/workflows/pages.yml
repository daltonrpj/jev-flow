name: Publish the static guide

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install standalone dependencies
        run: npm ci --ignore-scripts
      - name: Run standalone test suite
        run: npm test
      - uses: actions/configure-pages@v5
      - name: Verify public catalog certificate
        run: node --input-type=module -e "import {readFileSync} from 'node:fs'; import {catalogSourceFingerprint} from './services/jev-flow/compendium-catalog.mjs'; const c=JSON.parse(readFileSync('./site/catalog-certification.json')); if(c.scope!=='standalone'||c.passed!==true||c.version!=='jev-flow-catalog-v3'||c.candidateCount!==388080||c.validCount!==388080||c.uniqueKeys!==388080||c.uniqueIds!==388080||c.sourceFingerprint!==catalogSourceFingerprint()) process.exit(1)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
