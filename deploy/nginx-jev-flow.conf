# Replace every __DOMAIN__ before enabling. Requires a working TLS certificate.
# Example target: /etc/nginx/sites-available/jev-flow
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://__DOMAIN__$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Check the raw Host value too: $host can normalize away a supplied port.
    if ($http_host != __DOMAIN__) { return 444; }

    location = /jev {
        auth_basic "JEV Flow";
        auth_basic_user_file /etc/jev-flow/htpasswd;
        include /etc/nginx/snippets/jev-flow-proxy.conf;
    }
    location ^~ /jev/ {
        auth_basic "JEV Flow";
        auth_basic_user_file /etc/jev-flow/htpasswd;
        include /etc/nginx/snippets/jev-flow-proxy.conf;
    }
    location = /api {
        auth_basic "JEV Flow";
        auth_basic_user_file /etc/jev-flow/htpasswd;
        include /etc/nginx/snippets/jev-flow-proxy.conf;
    }
    location = /api/health {
        auth_basic off;
        return 404;
    }
    location ^~ /api/ {
        auth_basic "JEV Flow";
        auth_basic_user_file /etc/jev-flow/htpasswd;
        include /etc/nginx/snippets/jev-flow-proxy.conf;
    }
    location = /favicon.svg {
        alias /opt/jev-flow/current/site/assets/favicon.svg;
        default_type image/svg+xml;
    }
    location = /logo.svg {
        alias /opt/jev-flow/current/site/assets/mark.svg;
        default_type image/svg+xml;
    }
    location / {
        auth_basic off;
        root /opt/jev-flow/current/site;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
