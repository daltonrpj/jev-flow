# Temporary HTTP-only ACME webroot site; remove after the first certificate is issued.
# Replace __DOMAIN__ with the canonical Jev Flow hostname.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 404; }
}
